<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Газар зүйн Интерактив Платформ</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & RESET (100% OFFLINE STANDALONE STYLES)
           ========================================================================== */
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #059669;
            --primary-hover: #047857;
            --primary-light: #ecfdf5;
            --emerald: #10b981;
            --emerald-hover: #059669;
            --emerald-light: #d1fae5;
            --rose: #e11d48;
            --rose-hover: #be123c;
            --rose-light: #fff1f2;
            --amber: #d97706;
            --amber-light: #fffbeb;
            --cyan: #0891b2;
            --cyan-light: #ecfeff;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.12);
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #ecfdf5 0%, #f1f5f9 50%, #eef2ff 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* ==========================================================================
           2. HEADER & NAVIGATION
           ========================================================================== */
        .app-header {
            background: linear-gradient(90deg, #064e3b 0%, #0f172a 55%, #064e3b 100%);
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 40;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-md);
        }

        .header-inner {
            max-width: 1360px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #34d399, #059669, #047857);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.45);
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .igcse-pill {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: rgba(52, 211, 153, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(52, 211, 153, 0.35);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .brand-sub {
            font-size: 11px;
            color: #94a3b8;
        }

        .header-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .header-select, .header-btn {
            border-radius: 11px;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .header-select {
            background: rgba(30, 41, 59, 0.9);
            color: #f8fafc;
            outline: none;
            max-width: 210px;
        }

        .header-btn-lang {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .header-btn-lang:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .header-btn-admin {
            background: #d97706;
            color: #ffffff;
            border-color: #b45309;
        }

        .header-btn-admin:hover {
            background: #b45309;
        }

        .header-btn-admin.unlocked {
            background: #059669;
            border-color: #10b981;
        }

        .header-btn-icon {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 10px;
            font-size: 14px;
        }

        /* Navigation Tabs */
        .nav-bar-wrap {
            max-width: 1360px;
            margin: 16px auto 0;
            padding: 0 16px;
        }

        .nav-bar {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 6px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            box-shadow: var(--shadow-sm);
        }

        .nav-tab {
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.18s ease;
        }

        .nav-tab:hover {
            background: #f1f5f9;
            color: var(--text-primary);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, #0d9488 100%);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.28);
        }

        .nav-tab-logout {
            margin-left: auto;
            background: rgba(225, 29, 72, 0.1);
            color: #e11d48;
            border: 1px solid rgba(225, 29, 72, 0.2);
        }
        .nav-tab-logout:hover {
            background: rgba(225, 29, 72, 0.2);
            color: #be123c;
        }

        /* ==========================================================================
           3. MAIN CONTAINER & CARDS
           ========================================================================== */
        .main-container {
            max-width: 1360px;
            margin: 18px auto 40px;
            padding: 0 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-subtitle {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Buttons & Inputs */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.16s ease;
            font-family: inherit;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #0d9488);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-hover), #0f766e);
            transform: translateY(-1px);
        }

        .btn-emerald {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .btn-emerald:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-rose {
            background: var(--rose);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.22);
        }

        .btn-rose:hover:not(:disabled) {
            background: var(--rose-hover);
        }

        .btn-amber {
            background: #f59e0b;
            color: #0f172a;
        }

        .btn-amber:hover:not(:disabled) {
            background: #d97706;
            color: #ffffff;
        }

        .btn-outline {
            background: #ffffff;
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-sm {
            padding: 6px 11px;
            font-size: 11.5px;
            border-radius: 9px;
        }

        .input, .select, .textarea {
            width: 100%;
            padding: 10px 13px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            background: #ffffff;
            outline: none;
            transition: border-color 0.15s;
        }

        .input:focus, .select:focus, .textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 800;
        }

        .badge-indigo { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }
        .badge-emerald { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .badge-amber { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
        .badge-rose { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
        .badge-slate { background: #f1f5f9; color: #334155; }

        /* ==========================================================================
           4. DUAL SPINNING WHEEL STAGE
           ========================================================================== */
        .wheel-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #f8fafc;
            padding: 14px 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            margin-bottom: 18px;
        }

        .class-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .pill-btn {
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .pill-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .wheels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 920px) {
            .wheels-grid {
                grid-template-columns: 1fr;
            }
        }

        .wheel-box {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .wheel-box.highlighted {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12);
        }

        .wheel-box-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .wheel-badge-count {
            font-size: 11.5px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--primary-light);
            color: var(--primary);
        }

        .wheel-svg-stage {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0 14px;
        }

        .wheel-pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 28px solid #f59e0b;
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
        }

        .wheel-pointer::after {
            content: '';
            position: absolute;
            top: -31px;
            left: -7px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #0f172a;
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18), inset 0 0 0 6px #ffffff;
            will-change: transform;
        }

        .wheel-empty {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 3px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            background: #f8fafc;
        }

        .spin-master-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .btn-spin-both {
            padding: 15px 30px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 16px;
            background: linear-gradient(135deg, #059669 0%, #0d9488 50%, #2563eb 100%);
            color: #ffffff;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(5, 150, 105, 0.35);
            transition: transform 0.18s, box-shadow 0.18s;
        }

        .btn-spin-both:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 28px rgba(5, 150, 105, 0.45);
        }

        .btn-spin-both:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Active Challenge Panel */
        .challenge-card {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            color: #ffffff;
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-lg);
            border: 2px solid #059669;
            animation: popIn 0.28s ease;
        }

        .challenge-pair-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            margin-bottom: 18px;
        }

        .selected-student-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.45);
            padding: 8px 14px;
            border-radius: 14px;
        }

        .selected-question-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.25);
            border: 1px solid rgba(96, 165, 250, 0.45);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .challenge-q-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .challenge-q-en {
            font-size: 13.5px;
            color: #93c5fd;
            font-style: italic;
            margin-bottom: 18px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        @media (max-width: 680px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 13px 16px;
            border-radius: 14px;
            text-align: left;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(52, 211, 153, 0.35);
            border-color: #6ee7b7;
        }

        .option-btn.correct {
            background: rgba(5, 150, 105, 0.45);
            border-color: #34d399;
            color: #ecfdf5;
        }

        .option-btn.wrong {
            background: rgba(225, 29, 72, 0.45);
            border-color: #fb7185;
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
        }

        .oral-grading-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(255, 255, 255, 0.07);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
        }

        /* Pool Management & Eliminated Lists */
        .pool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 820px) {
            .pool-grid {
                grid-template-columns: 1fr;
            }
        }

        .pool-panel {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .elim-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .elim-chip button {
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           5. TABLES, ANALYTICS & LABS
           ========================================================================== */
        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f8fafc;
            color: var(--text-secondary);
            font-weight: 800;
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tr:hover td {
            background: #f8fafc;
        }

        tr.active-student-row td {
            background: #ecfdf5;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }

        .kpi-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
        }

        .kpi-label {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .kpi-val {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 4px 0;
        }

        /* Modals & Toasts */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: var(--radius-xl);
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            animation: popIn 0.22s ease;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 70;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: popIn 0.2s ease;
        }

        .toast-success { background: #059669; }
        .toast-error { background: #e11d48; }
        .toast-info { background: #1e293b; }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 80;
            animation: confettiFall 1.4s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }

        /* ==========================================================================
           1. WEB AUDIO API SOUND ENGINE
           ========================================================================== */
        const SoundFX = {
            ctx: null,
            muted: false,
            init() {
                if (this.muted) return;
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            tick() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(760, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.035);
                gain.gain.setValueAtTime(0.09, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.035);
            },
            fanfare() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.18, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.36);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.36);
                });
            },
            buzzer() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(175, now);
                osc.frequency.exponentialRampToValueAtTime(95, now + 0.34);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.34);
            }
        };

                el.className = 'confetti-piece';

                el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1450);
            }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type = 'success') {
            const root = document.getElementById('toast-root');
            if (!root) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            root.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                toast.style.transition = 'all 0.2s ease';
                setTimeout(() => toast.remove(), 220);
            }, 3100);
        }

        function awardStudentPoints(studentId, delta, category = 'map', reason = 'Газар зүйн даалгавар') {
            const st = state.students.find(s => s.id === studentId);
            if (!st) return;

            if (category === 'participation') {
                st.participation = Math.max(0, (st.participation || 0) + delta);
            } else if (category === 'geo') {
                st.geoPoints = Math.max(0, (st.geoPoints || 0) + delta);
            } else {
                st.mapPoints = Math.max(0, (st.mapPoints || 0) + delta);
            }

            if (!Array.isArray(st.history)) st.history = [];
            st.history.unshift({ text: reason, delta, time: 'Саяхан' });
            if (st.history.length > 30) st.history.pop();

            if (!Array.isArray(state.analytics.activityStream)) state.analytics.activityStream = [];
            state.analytics.activityStream.unshift({
                text: `${st.name} (${st.className}) — ${reason} (${delta >= 0 ? '+' + delta : delta} оноо)`,
                time: 'Саяхан'
            });
            if (state.analytics.activityStream.length > 25) state.analytics.activityStream.pop();

            const todayBucket = state.analytics.dailyTraffic?.[state.analytics.dailyTraffic.length - 1];
            if (todayBucket && delta > 0) {
                todayBucket.pts = (todayBucket.pts || 0) + delta;
            }
            saveState();
        }

        const WHEEL_COLORS = ['#059669', '#3b82f6', '#d97706', '#0891b2', '#e11d48', '#4f46e5', '#16a34a', '#db2777', '#ea580c'];

        function buildSvgWheelMarkup(items, labelFn, angleDeg, svgId) {
            const size = 320, cx = size / 2, cy = size / 2, r = 150;
            const count = items.length;
            const sliceDeg = 360 / count;

            let slicesSvg = '';
            for (let i = 0; i < count; i++) {
                const startDeg = i * sliceDeg;
                const endDeg = startDeg + sliceDeg;
                const midDeg = startDeg + sliceDeg / 2;
                const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
                const rawLabel = String(labelFn(items[i]) || '');
                const shortLabel = rawLabel.length > 16 ? rawLabel.slice(0, 15) + '…' : rawLabel;

                if (count === 1) {
                    slicesSvg += `
                        <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="#ffffff" stroke-width="2.5" />
                        <text x="${cx}" y="${cy - 45}" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">${escapeHtml(shortLabel)}</text>
                    `;
                } else {
                    const startRad = (startDeg * Math.PI) / 180;
                    const endRad = (endDeg * Math.PI) / 180;
                    const x1 = cx + r * Math.cos(startRad);
                    const y1 = cy + r * Math.sin(startRad);
                    const x2 = cx + r * Math.cos(endRad);
                    const y2 = cy + r * Math.sin(endRad);
                    const largeArc = sliceDeg > 180 ? 1 : 0;

                    slicesSvg += `
                        <path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z"
                              fill="${color}" stroke="#ffffff" stroke-width="2" />
                        <g transform="translate(${cx}, ${cy}) rotate(${midDeg})">
                            <text x="${r - 14}" y="4" fill="#ffffff" font-size="${count > 12 ? 10 : 11.5}" font-weight="800" text-anchor="end">
                                ${escapeHtml(shortLabel)}
                            </text>
                        </g>
                    `;
                }
            }

            return `
                <svg id="${svgId}" class="wheel-svg" viewBox="0 0 ${size} ${size}" style="transform: rotate(${angleDeg}deg);">
                    ${slicesSvg}
                    <circle cx="${cx}" cy="${cy}" r="22" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
                    <circle cx="${cx}" cy="${cy}" r="7" fill="#34d399" />
                </svg>
            `;
        }

        function animateWheelSpin({ which, items, onComplete }) {
            if (!items || items.length === 0) return;
            const isStudent = which === 'student';
            if (isStudent) ui.isSpinningStudent = true;
            else ui.isSpinningQuestion = true;

            const count = items.length;
            const sliceDeg = 360 / count;
            const targetIdx = Math.floor(Math.random() * count);
            const targetCenterDeg = (targetIdx + 0.5) * sliceDeg;
            const jitter = (Math.random() - 0.5) * (sliceDeg * 0.45);
            const desiredMod = (((270 - (targetCenterDeg + jitter)) % 360) + 360) % 360;

            const startAngle = isStudent ? ui.studentWheelAngle : ui.questionWheelAngle;
            const currentMod = ((startAngle % 360) + 360) % 360;
            const deltaMod = (desiredMod - currentMod + 360) % 360;
            const totalRotation = 5 * 360 + deltaMod;
            const finalAngle = startAngle + totalRotation;

            const duration = 2700;
            const startTime = performance.now();
            let lastSlicePassed = -1;
            const svgId = isStudent ? 'svg-student-wheel' : 'svg-question-wheel';

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentAngle = startAngle + totalRotation * eased;

                const svgEl = document.getElementById(svgId);
                if (svgEl) svgEl.style.transform = `rotate(${currentAngle}deg)`;

                const slicePassed = Math.floor(currentAngle / sliceDeg);
                if (slicePassed !== lastSlicePassed) {
                    lastSlicePassed = slicePassed;
                    SoundFX.tick();
                }

                if (progress < 1) requestAnimationFrame(step);
                else {
                    if (isStudent) { ui.studentWheelAngle = finalAngle; ui.isSpinningStudent = false; }
                    else { ui.questionWheelAngle = finalAngle; ui.isSpinningQuestion = false; }
                    onComplete(items[targetIdx]);
                }
            }
            requestAnimationFrame(step);
        }

            render();

            animateWheelSpin({ which: 'student', items: activeStudents, onComplete: (c) => { ui.selectedStudentId = c.id; ui.activeStudentId = c.id; checkDone(); } });
            animateWheelSpin({ which: 'question', items: activeQuestions, onComplete: (c) => { ui.selectedQuestionId = c.id; checkDone(); } });
        }

        function answerWheelMcq(optIdx) {
            if (ui.wheelAnsweredState) return;
            const q = state.questions.find(item => item.id === ui.selectedQuestionId);
            if (!q) return;

            const isCorrect = optIdx === q.correct;
            ui.wheelAnsweredState = { chosenOpt: optIdx, isCorrect };
            recordAttempt(isCorrect, 'wheel');

            const st = state.students.find(s => s.id === ui.selectedStudentId);
            if (isCorrect) {
                SoundFX.fanfare(); triggerBurst();
                if (st) {
                    awardStudentPoints(st.id, 15, 'participation', `Хүрдний асуулт зөв хариулсан`);
                    if (!state.eliminatedStudentIds.includes(st.id)) state.eliminatedStudentIds.push(st.id);
                }
                if (!state.eliminatedQuestionIds.includes(q.id)) state.eliminatedQuestionIds.push(q.id);
                saveState();
                showToast(`🎉 Зөв хариуллаа! ${st ? st.name + ' +15 оноо авч хүрднээс хасагдлаа!' : ''}`);
            } else {
                SoundFX.buzzer();
                if (st) awardStudentPoints(st.id, 3, 'participation', `Хүрдний асуултад оролдлого хийсэн (+3)`);
                showToast('Буруу хариуллаа! Сурагч болон асуулт хүрдэнд үлдлээ.', 'error');
            }
            render();
        }

        function gradeWheelOral(mode) {
            const st = state.students.find(s => s.id === ui.selectedStudentId);
            const q = state.questions.find(item => item.id === ui.selectedQuestionId);
            if (mode === 'pass') {
                SoundFX.fanfare(); triggerBurst(); recordAttempt(true, 'wheel');
                if (st) {
                    awardStudentPoints(st.id, 15, 'participation', 'Хүрдний аман хариулт зөв (+15)');
                    if (!state.eliminatedStudentIds.includes(st.id)) state.eliminatedStudentIds.push(st.id);
                }
                if (q && !state.eliminatedQuestionIds.includes(q.id)) state.eliminatedQuestionIds.push(q.id);
                saveState();
                showToast(`✅ ${st ? st.name : 'Сурагч'} +15 оноо авч хүрднээс хасагдлаа!`);
            } else if (mode === 'partial') {
                SoundFX.tick(); recordAttempt(true, 'wheel');
                if (st) {
                    awardStudentPoints(st.id, 5, 'participation', 'Хэсэгчлэн хариулсан (+5)');
                    if (!state.eliminatedStudentIds.includes(st.id)) state.eliminatedStudentIds.push(st.id);
                }
                saveState();
                showToast(`👍 ${st ? st.name : 'Сурагч'} +5 оролцооны оноо авч хүрднээс хасагдлаа!`, 'info');
            } else {
                SoundFX.buzzer(); recordAttempt(false, 'wheel');
                showToast('Хүрдэнд хэвээр үлдлээ.', 'info');
            }
            ui.selectedStudentId = null; ui.selectedQuestionId = null; ui.wheelAnsweredState = null;
            render();
        }

        function restoreStudentToWheel(id) { state.eliminatedStudentIds = state.eliminatedStudentIds.filter(x => x !== id); saveState(); render(); }
        function restoreQuestionToWheel(id) { state.eliminatedQuestionIds = state.eliminatedQuestionIds.filter(x => x !== id); saveState(); render(); }
        function restoreAllWheelPools() { state.eliminatedStudentIds = []; state.eliminatedQuestionIds = []; ui.selectedStudentId = null; ui.selectedQuestionId = null; ui.wheelAnsweredState = null; saveState(); showToast('Бүгдийг сэргээлээ!'); render(); }

        /* ==========================================================================
           5. KEYWORD TRAINER HELPERS
           ========================================================================== */
        function getFilteredKeywords() {
            return state.keywords.filter(kw => {
                if (ui.kwTopic !== 'ALL' && !kw.chapter.includes(ui.kwTopic)) return false;
                if (ui.kwSearch.trim() !== '') {
                    const s = ui.kwSearch.trim().toLowerCase();
                    if (!kw.term.toLowerCase().includes(s) && !kw.mn.toLowerCase().includes(s) && !kw.chapter.toLowerCase().includes(s)) return false;
                }
                return true;
            });
        }

        function markKeywordMastered(kwId) {
            if (!state.masteredKeywordIds.includes(kwId)) {
                state.masteredKeywordIds.push(kwId);
                SoundFX.fanfare();
                if (ui.activeStudentId) {
                    awardStudentPoints(ui.activeStudentId, 10, 'map', 'Түлхүүр үг цээжилсэн (+10)');
                    showToast('⭐ +10 оноо нэмэгдлээ!');
                } else {
                    showToast('⭐ Түлхүүр үг эзэмшсэнээр тэмдэглэгдлээ!');
                }
                saveState();
                render();
            }
        }

        function initKeywordMatchRound() {
            const pool = [...state.keywords].sort(() => Math.random() - 0.5).slice(0, 6);
            ui.matchPairs = pool; ui.matchShuffledDefs = [...pool].sort(() => Math.random() - 0.5);
            ui.matchSelectedTermId = null; ui.matchMatchedIds = []; ui.matchWrongDefId = null;
            ui.matchStartTime = Date.now(); ui.matchElapsedSec = 0; ui.matchCompleted = false;
        }

        function handleMatchTermClick(id) {
            if (ui.matchMatchedIds.includes(id)) return;
            SoundFX.tick(); ui.matchSelectedTermId = id; ui.matchWrongDefId = null; render();
        }

        function handleMatchDefClick(id) {
            if (!ui.matchSelectedTermId || ui.matchMatchedIds.includes(id)) return;
            if (ui.matchSelectedTermId === id) {
                SoundFX.tick(); ui.matchMatchedIds.push(id); ui.matchSelectedTermId = null;
                if (ui.matchMatchedIds.length === ui.matchPairs.length) {
                    ui.matchCompleted = true; ui.matchElapsedSec = Math.floor((Date.now() - ui.matchStartTime) / 1000);
                    SoundFX.fanfare(); triggerBurst(); recordAttempt(true, 'keywords');
                    if (ui.activeStudentId) {
                        awardStudentPoints(ui.activeStudentId, 15, 'map', `Keyword хурдны эвлүүлэг (${ui.matchElapsedSec} сек)`);
                        showToast(`🎉 Бүгдийг ${ui.matchElapsedSec} сек-д тааруулж +15 оноо авлаа!`);
                    } else showToast(`🎉 Бүгдийг ${ui.matchElapsedSec} сек-д зөв эвлүүллээ!`);
                }
                render();
            } else {
                SoundFX.buzzer(); ui.matchWrongDefId = id; render();
                setTimeout(() => { ui.matchWrongDefId = null; render(); }, 480);
            }
        }

        function checkKeywordSpelling() {
            const list = getFilteredKeywords().length > 0 ? getFilteredKeywords() : state.keywords;
            if (list.length === 0) return;
            const current = list[ui.spellIdx % list.length];
            const cleanUser = ui.spellInput.trim().toLowerCase().replace(/\s+/g, ' ');
            const cleanTarget = current.term.trim().toLowerCase().replace(/\s+/g, ' ');

            if (cleanUser === cleanTarget) {
                ui.spellFeedback = { ok: true, msg: `Яг зөв! "${current.term}"` };
                SoundFX.fanfare(); recordAttempt(true, 'keywords');
                if (ui.activeStudentId) {
                    awardStudentPoints(ui.activeStudentId, 15, 'map', `Keyword бичгийн сорил: ${current.term}`);
                    showToast(`✅ Зөв бичлээ! +15 оноо бүртгэгдлээ.`);
                }
            } else {
                ui.spellFeedback = { ok: false, msg: `Буруу байна. Зөв: "${current.term}"` };
                SoundFX.buzzer(); recordAttempt(false, 'keywords');
            }
            render();
        }

        /* ==========================================================================
           5.1 QUIZ AND FACT HELPER FUNCTIONS
           ========================================================================== */
        function answerQuizMcq(optIdx) {
            if (ui.quizSubmitted || state.questions.length === 0) return;
            const q = state.questions[ui.quizIdx % state.questions.length];
            ui.quizSubmitted = true; ui.quizSelectedOpt = optIdx;
            const isCorrect = optIdx === q.correct;
            recordAttempt(isCorrect, 'quiz');

            if (isCorrect) {
                SoundFX.fanfare(); triggerBurst();
                if (ui.activeStudentId) { awardStudentPoints(ui.activeStudentId, 10, 'map', 'Жишиг тест (MCQ)'); showToast('🎉 Зөв хариуллаа! +10 оноо.'); }
                else showToast('🎉 Зөв хариуллаа!');
            } else {
                SoundFX.buzzer(); showToast('Буруу хариуллаа!', 'error');
            }
            render();
        }

        function nextQuizMcq() { ui.quizIdx++; ui.quizSubmitted = false; ui.quizSelectedOpt = null; ui.quizShowHint = false; render(); }

        function answerQuizFact(isTrueBtn) {
            if (ui.factAnswered || state.factChecks.length === 0) return;
            const f = state.factChecks[ui.factIdx % state.factChecks.length];
            const isCorrect = isTrueBtn === f.isTrue;
            ui.factAnswered = { isTrueBtn, isCorrect };
            recordAttempt(isCorrect, 'factcheck');

            if (isCorrect) {
                SoundFX.fanfare(); triggerBurst();
                if (ui.activeStudentId) { awardStudentPoints(ui.activeStudentId, 10, 'map', 'Үнэн/Худал сорил'); showToast('🎉 Зөв! +10 оноо.'); }
                else showToast('🎉 Зөв байна!');
            } else {
                SoundFX.buzzer(); showToast('Буруу байна!', 'error');
            }
            render();
        }
        function nextQuizFact() { ui.factIdx++; ui.factAnswered = null; render(); }

                                const q = cat.questions[rowIdx];
                                return `<button class="jeopardy-tile ${q.used ? 'used' : ''}" ${q.used ? 'disabled' : ''} onclick="openJeopardyTile(${catIdx}, ${rowIdx})">${q.used ? '✓' : q.points}</button>`;

        function adjustJeopardyTeam(idx, delta) { state.jeopardyTeams[idx].score += delta; if (delta > 0) SoundFX.tick(); else SoundFX.buzzer(); saveState(); render(); }
        function openJeopardyTile(catIdx, qIdx) { SoundFX.tick(); ui.jeopardyModal = { catIdx, qIdx, showHint: false, showAnswer: false, awardStudentId: ui.activeStudentId || '' }; render(); }
        function completeJeopardyTile(teamIdx) {
            if (!ui.jeopardyModal) return;
            const { catIdx, qIdx, awardStudentId } = ui.jeopardyModal;
            const q = state.jeopardyBoard[catIdx].questions[qIdx]; q.used = true;
            if (teamIdx !== null && teamIdx >= 0) {
                state.jeopardyTeams[teamIdx].score += q.points; SoundFX.fanfare(); triggerBurst(); recordAttempt(true, 'jeopardy');
                let msg = `🏆 ${state.jeopardyTeams[teamIdx].name} +${q.points} оноо авлаа!`;
                if (awardStudentId) {
                    const bonusGeo = Math.round(q.points / 20);
                    awardStudentPoints(awardStudentId, bonusGeo, 'participation', `Jeopardy багтаа оноо авчирсан`);
                    const st = state.students.find(s => s.id === awardStudentId);
                    if (st) msg += ` (${st.name} +${bonusGeo} оноо)`;
                }
                showToast(msg);
            } else { SoundFX.buzzer(); recordAttempt(false, 'jeopardy'); }
            ui.jeopardyModal = null; saveState(); render();
        }
        function resetJeopardyBoard() { openConfirm('Jeopardy самбарыг шинэчлэх үү?', 'Багуудын оноо болон нүднүүд шинэчлэгдэнэ.', () => { state.jeopardyTeams.forEach(t => t.score = 0); state.jeopardyBoard.forEach(cat => cat.questions.forEach(q => q.used = false)); saveState(); render(); }); }

        /* --------------------------------------------------------------------------

        function exportLeaderboardCsv() {
            const headers = ['Байр', 'Анги', 'Сурагчийн нэр', 'Идэвх', 'Дадлага', 'Geography Point', 'Нийт оноо', 'Нэмэлт дүн'];
            const sorted = [...state.students].filter(s => ui.lbClassFilter === 'ALL' || s.className === ui.lbClassFilter).sort((a, b) => getTotalPoints(b) - getTotalPoints(a));
            const rows = sorted.map((s, i) => [i + 1, s.className, `"${s.name}"`, s.participation || 0, s.mapPoints || 0, s.geoPoints || 0, getTotalPoints(s), getBonusGrade(getTotalPoints(s))].join(','));
            const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Geo_Onoo_${ui.lbClassFilter}.csv`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
            showToast('Тайлан амжилттай татагдлаа!');
        }

        function renderLeaderboardModule() {
            let list = state.students.filter(s => {
                if (ui.lbClassFilter !== 'ALL' && s.className !== ui.lbClassFilter) return false;
                if (ui.lbSearch.trim() !== '' && !s.name.toLowerCase().includes(ui.lbSearch.trim().toLowerCase()) && !s.className.toLowerCase().includes(ui.lbSearch.trim().toLowerCase())) return false;
                return true;
            }).sort((a, b) => {
                if (ui.lbSort === 'part_desc') return (b.participation || 0) - (a.participation || 0);
                if (ui.lbSort === 'map_desc') return (b.mapPoints || 0) - (a.mapPoints || 0);
                return getTotalPoints(b) - getTotalPoints(a);
            });

            return `
                <div class="card">
                    <div class="card-header">
                        <div><h2 class="card-title">📊 Онооны Самбар ба Урамшуулал</h2><p class="card-subtitle">${state.pointsPerBonus} оноо = Улирлын дүнд +1.0 оноо (Дээд хязгаар: +${state.maxBonus})</p></div>
                        <div class="no-print" style="display:flex; gap:8px;">
                            <button class="btn btn-emerald btn-sm" onclick="exportLeaderboardCsv()">📥 Excel (.CSV)</button>
                            <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ Хэвлэх / PDF</button>
                        </div>
                    </div>
                    <div class="wheel-toolbar no-print">
                        <div class="class-pills">
                            ${['ALL', ...state.classes].map(cls => `<button class="pill-btn ${ui.lbClassFilter === cls ? 'active' : ''}" onclick="ui.lbClassFilter='${cls}'; render();">${cls === 'ALL' ? 'Бүгд' : cls}</button>`).join('')}
                        </div>
                        <div style="display:flex; gap:8px;">
                            <input class="input" style="width:190px;" placeholder="🔍 Нэрээр хайх..." value="${escapeHtml(ui.lbSearch)}" oninput="ui.lbSearch=this.value; render();" />
                            <select class="select" style="width:185px;" onchange="ui.lbSort=this.value; render();">
                                <option value="total_desc" ${ui.lbSort === 'total_desc' ? 'selected' : ''}>Нийт оноогоор</option>
                                <option value="part_desc" ${ui.lbSort === 'part_desc' ? 'selected' : ''}>Идэвхээр</option>
                                <option value="map_desc" ${ui.lbSort === 'map_desc' ? 'selected' : ''}>Дадлагаар</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>Байр</th><th>Нэр</th><th>Анги</th><th>Идэвх</th><th>Дадлага</th><th>Geography Point</th><th>Нийт</th><th>Нэмэлт дүн</th><th class="no-print">Үйлдэл</th></tr>
                            </thead>
                            <tbody>
                                ${list.map((st, idx) => {
                                    const total = getTotalPoints(st), bonus = getBonusGrade(total);
                                    return `
                                        <tr class="${st.id === ui.activeStudentId ? 'active-student-row' : ''}">
                                            <td style="font-weight:800;">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}</td>
                                            <td style="font-weight:800;">${escapeHtml(st.name)}</td>
                                            <td><span class="badge badge-indigo">${escapeHtml(st.className)}</span></td>
                                            <td style="font-weight:700; color:#4f46e5;">${st.participation || 0}${ui.adminUnlocked ? `<button class="btn btn-sm btn-outline" style="padding:2px 6px; margin-left:4px;" onclick="promptEditScore('${st.id}', 'participation', 'Идэвх')">✏️</button>` : ''}</td>
                                            <td style="font-weight:700; color:#0891b2;">${st.mapPoints || 0}${ui.adminUnlocked ? `<button class="btn btn-sm btn-outline" style="padding:2px 6px; margin-left:4px;" onclick="promptEditScore('${st.id}', 'mapPoints', 'Дадлага')">✏️</button>` : ''}</td>
                                            <td style="font-weight:700; color:#d97706;">${st.geoPoints || 0}${ui.adminUnlocked ? `<button class="btn btn-sm btn-outline" style="padding:2px 6px; margin-left:4px;" onclick="promptEditScore('${st.id}', 'geoPoints', 'Geography Point')">✏️</button>` : ''}</td>
                                            <td style="font-weight:800;">${total}</td>
                                            <td><span class="badge badge-emerald">+${bonus}</span></td>
                                            <td class="no-print" style="white-space:nowrap;">
                                                ${ui.adminUnlocked ? `<button class="btn btn-amber btn-sm" onclick="quickGiveGeoPoints('${st.id}', 10)">⭐ +10</button>` : ''}
                                                <button class="btn btn-outline btn-sm" onclick="ui.historyModalStudentId='${st.id}'; render();">📜</button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function promptEditScore(studentId, field, label) {
            const st = state.students.find(s => s.id === studentId);
            if (!st) return;
            const current = st[field] || 0;
            const input = prompt(`"${st.name}" сурагчийн [${label}] оноог засах:`, current);
            if (input !== null && input.trim() !== '') {
                const num = parseInt(input, 10);
                if (!isNaN(num)) { st[field] = Math.max(0, num); saveState(); showToast(`${label} засагдлаа!`); render(); }
                else showToast('Тоо оруулна уу!', 'error');
            }
        }
        function quickGiveGeoPoints(studentId, delta) { awardStudentPoints(studentId, delta, 'geo', `Урамшуулал (+${delta})`); SoundFX.fanfare(); showToast(`⭐ Geography Point олгогдлоо (+${delta})`); render(); }

                    ${ui.quizSubmitted ? `<div style="background:rgba(16,185,129,0.18); padding:10px; border-radius:12px; margin-top:12px; color:#d1fae5;"><strong>✅ ${escapeHtml(q.explanation)}</strong></div>` : ''}

        function renderQuizFactSection() {
            if (state.factChecks.length === 0) return `<p>Үнэн/Худал асуулт алга байна.</p>`;
            const f = state.factChecks[ui.factIdx % state.factChecks.length];
            return `
                <div style="background:linear-gradient(135deg, #1e293b, #0f172a); color:#fff; border-radius:20px; padding:22px; max-width:700px; margin:0 auto;">

            if (state.questions.length === 0) return `<div class="card"><p>Асуулт алга байна.</p></div>`;
            const q = state.questions[ui.rocketQIdx % state.questions.length];
            const visualAlt = Math.min(320, ui.rocketAltitude);
            return `
                <div class="card">
                    <div class="card-header"><div><h2 class="card-title">🚀 Пуужин хөөргөх</h2></div></div>
                    <div class="rocket-scene ${ui.rocketWrongShake ? 'shake-error' : ''}">

                        <div class="hud-panel"><div class="hud-box">ӨНДӨР: ${ui.rocketAltitude} КМ</div></div>
                        <div class="rocket-svg-container" style="bottom: ${visualAlt}px;">
                            ${ui.rocketSubmitted && ui.rocketSelectedOpt !== q.correct ? `<div style="font-size:64px; text-align:center;">💥</div>` : `
                                <svg viewBox="0 0 64 128" width="100%" height="100%">
                                    <path class="rocket-flame" d="M24 100 Q32 130 40 100 Q32 110 24 100" fill="#f97316"/>
                                    <path class="rocket-flame" d="M28 100 Q32 120 36 100 Q32 105 28 100" fill="#fde047" style="animation-delay: 0.05s;"/>
                                    <path d="M32 50 L12 90 L20 100 L32 90 Z" fill="#ef4444"/>
                                    <path d="M32 50 L52 90 L44 100 L32 90 Z" fill="#ef4444"/>
                                    <path d="M32 10 C45 30 44 80 40 100 L24 100 C20 80 19 30 32 10 Z" fill="#f8fafc"/>
                                    <circle cx="32" cy="45" r="8" fill="#34d399"/>
                                </svg>
                            `}
                        </div>
                    </div>
                    <div style="background:#0f172a; color:#ffffff; border-radius:20px; padding:22px; max-width:780px; margin:0 auto;">
                        <div class="challenge-q-text">${escapeHtml(q.questionMn)}</div>
                        <div class="options-grid" style="margin-top:16px;">
                            ${q.options.map((opt, idx) => {
                                let cls = 'option-btn';
                                if (!ui.rocketSubmitted && ui.rocketSelectedOpt === idx) cls += ' selected';
                                if (ui.rocketSubmitted) { if (idx === q.correct) cls += ' correct'; else if (idx === ui.rocketSelectedOpt) cls += ' wrong'; }
                                return `<button class="${cls}" style="${!ui.rocketSubmitted && ui.rocketSelectedOpt === idx ? 'border-color:#34d399; background:rgba(52,211,153,0.22);' : ''}" onclick="if(!ui.rocketSubmitted){ SoundFX.tick(); ui.rocketSelectedOpt=${idx}; render(); }"><span class="option-letter">${['A', 'B', 'C', 'D'][idx]}</span><span>${escapeHtml(opt)}</span></button>`;
                            }).join('')}
                        </div>
                        <div style="display:flex; justify-content:flex-end; margin-top:16px;">
                            ${!ui.rocketSubmitted ? `<button class="btn btn-emerald" onclick="submitRocketAnswer()" ${ui.rocketSelectedOpt === null ? 'disabled' : ''}>Хөөргөх 🚀</button>` : `<button class="btn btn-primary" onclick="ui.rocketQIdx=(ui.rocketQIdx+1)%${state.questions.length}; ui.rocketSelectedOpt=null; ui.rocketSubmitted=false; render();">Дараагийнх ➔</button>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function submitRocketAnswer() {
            const q = state.questions[ui.rocketQIdx % state.questions.length];
            if (ui.rocketSelectedOpt === null || ui.rocketSubmitted) return;
            ui.rocketSubmitted = true;
            const isCorrect = ui.rocketSelectedOpt === q.correct;
            recordAttempt(isCorrect, 'rocket');

            if (isCorrect) {
                ui.rocketAltitude += 50; SoundFX.fanfare();
                if (ui.activeStudentId) { awardStudentPoints(ui.activeStudentId, 10, 'map', `Пуужин хөөргөсөн`); showToast('🎉 Зөв! Пуужин дээшиллээ.'); }
            } else {
                SoundFX.buzzer(); ui.rocketAltitude = Math.max(20, ui.rocketAltitude - 10); ui.rocketWrongShake = true;
                showToast('Буруу хариуллаа!', 'error'); setTimeout(() => { ui.rocketWrongShake = false; render(); }, 500);
            }
            render();
        }

        function renderAnalyticsModule() {

            const acc = state.analytics.totalAttempts > 0 ? Math.round((state.analytics.correctAnswers / state.analytics.totalAttempts) * 100) : 0;

            return `
                <div>

        function handleSaveMcqQuestion(e) {
            e.preventDefault();
            const paper = document.getElementById('qPaperInp').value.trim() || 'Газар зүй';
            const topic = document.getElementById('qTopicInp').value.trim();
            const questionMn = document.getElementById('qMnInp').value.trim();
            const questionEn = document.getElementById('qEnInp').value.trim() || questionMn;
            const options = [
                document.getElementById('qOpt0').value.trim(),
                document.getElementById('qOpt1').value.trim(),
                document.getElementById('qOpt2').value.trim(),
                document.getElementById('qOpt3').value.trim()
            ];
            const correct = Number(document.getElementById('qCorrectSel').value);
            const hint = document.getElementById('qHintInp').value.trim() || 'Бодоод үзээрэй!';
            const explanation = document.getElementById('qExpInp').value.trim() || `Зөв хариулт: ${options[correct]}`;

            if (ui.adminEditQuestionId) {
                const idx = state.questions.findIndex(q => q.id === ui.adminEditQuestionId);
                if (idx !== -1) {
                    state.questions[idx] = { ...state.questions[idx], paper, topic, questionMn, questionEn, options, correct, hint, explanation };
                    showToast(`Асуулт #${ui.adminEditQuestionId} шинэчлэгдлээ!`);
                }
                ui.adminEditQuestionId = null;
            } else {
                const maxId = state.questions.reduce((m, q) => Math.max(m, Number(q.id) || 0), 0);
                state.questions.push({ id: maxId + 1, paper, topic, questionMn, questionEn, options, correct, hint, explanation });
                showToast('Шинэ асуулт хүрд болон тестэд нэмэгдлээ!');
            }
            saveState();
            render();
        }

        function deleteMcqQuestion(id) {
            openConfirm(`Асуулт #${id}-г устгах уу?`, 'Хүрд болон тестээс бүрмөсөн устана.', () => {
                state.questions = state.questions.filter(q => q.id !== id);
                state.eliminatedQuestionIds = state.eliminatedQuestionIds.filter(qid => qid !== id);
                if (ui.adminEditQuestionId === id) ui.adminEditQuestionId = null;
                saveState();
                showToast('Асуулт устгагдлаа.');
                render();
            });
        }

        function handleSaveFactQuestion(e) {

            const statementMn = document.getElementById('fMnInp').value.trim();
            const statementEn = document.getElementById('fEnInp').value.trim() || statementMn;
            const isTrue = document.getElementById('fTrueSel').value === 'true';

            if (ui.adminFactEditId) {

                    state.factChecks[idx] = { ...state.factChecks[idx], topic, statementMn, statementEn, isTrue, explanation };
                    showToast('Баримт шинэчлэгдлээ!');
                }
                ui.adminFactEditId = null;
            } else {
                const maxId = state.factChecks.reduce((m, f) => Math.max(m, Number(f.id) || 0), 0);
                state.factChecks.push({ id: maxId + 1, topic, statementMn, statementEn, isTrue, explanation });
                showToast('Шинэ Үнэн/Худал асуулт нэмэгдлээ!');
            }
            saveState();
            render();
        }

                        <div class="modal-backdrop" onclick="ui.historyModalStudentId=null; render();">
                            <div class="modal-card" onclick="event.stopPropagation();">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                                    <div><span class="badge badge-indigo">${escapeHtml(st.className)} анги</span><h3 style="font-size:19px; font-weight:800; margin-top:4px;">📜 ${escapeHtml(st.name)}</h3></div>
                                    <button class="btn btn-outline btn-sm" onclick="ui.historyModalStudentId=null; render();">✕ Хаах</button>
                                </div>
                                <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:14px; text-align:center;">
                                    <div class="pool-panel"><strong>${st.participation || 0}</strong><div style="font-size:11px;">Идэвх</div></div>
                                    <div class="pool-panel"><strong>${st.mapPoints || 0}</strong><div style="font-size:11px;">Дадлага</div></div>
                                    <div class="pool-panel"><strong style="color:#d97706;">${st.geoPoints || 0}</strong><div style="font-size:11px;">Geo Point</div></div>
                                </div>
                                <div style="display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto;">
                                    ${(st.history || []).length === 0 ? '<p style="font-size:13px; color:#64748b;">Түүх хоосон.</p>' : st.history.map(h => `
                                        <div style="padding:10px; border:1px solid #e2e8f0; border-radius:12px; display:flex; justify-content:space-between; font-size:13px;">
                                            <span>${escapeHtml(h.text)}</span>
                                            <span class="badge ${h.delta >= 0 ? 'badge-emerald' : 'badge-rose'}">${h.delta >= 0 ? '+' + h.delta : h.delta}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
            if (ui.confirmModal) {
                html += `
                    <div class="modal-backdrop" onclick="ui.confirmModal=null; render();">
                        <div class="modal-card" style="max-width:420px; text-align:center;" onclick="event.stopPropagation();">
                            <h3 style="font-size:18px; font-weight:800; margin-bottom:8px;">${escapeHtml(ui.confirmModal.title)}</h3>
                            <p style="font-size:13.5px; margin-bottom:18px;">${escapeHtml(ui.confirmModal.message)}</p>
                            <div style="display:flex; justify-content:center; gap:8px;">
                                <button class="btn btn-outline" onclick="ui.confirmModal=null; render();">Болих</button>
                                <button class="btn btn-rose" onclick="const fn=ui.confirmModal.onConfirm; ui.confirmModal=null; fn();">Тийм</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            return html;
        }

        function render() {
            const appEl = document.getElementById('app');
            if (!appEl) return;
            if (ui.view === 'login') { appEl.innerHTML = `${renderLoginScreen()}<div id="toast-root" class="toast-container"></div>`; return; }
            let activeViewHtml = '';
            if (ui.activeTab === 'wheel') activeViewHtml = renderWheelModule();
            else if (ui.activeTab === 'jeopardy') activeViewHtml = renderJeopardyModule();
            else if (ui.activeTab === 'keywords') activeViewHtml = renderKeywordsModule();
            else if (ui.activeTab === 'leaderboard') activeViewHtml = renderLeaderboardModule();
            else if (ui.activeTab === 'quiz') activeViewHtml = renderQuizAndFactModule();
            else if (ui.activeTab === 'rocket') activeViewHtml = renderRocketModule();
            else if (ui.activeTab === 'analytics') activeViewHtml = renderAnalyticsModule();
            else if (ui.activeTab === 'admin') activeViewHtml = renderAdminModule();

            appEl.innerHTML = `${renderHeader()}${renderNavBar()}<main class="main-container">${activeViewHtml}</main>${renderModals()}<div id="toast-root" class="toast-container"></div>`;
        }

        render();
    </script>
</body>
</html>
